let lang = 'en';
try { lang = localStorage.getItem('ea_lang') || 'en'; } catch(e){}
function t(k){ return (LANGS[lang] && LANGS[lang][k]) || LANGS.en[k] || k; }
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
  document.getElementById('langLbl').textContent = (lang === 'en' ? 'አማርኛ' : 'English');
  if (me) renderAll();
}
function toggleLang(){
  lang = (lang === 'en') ? 'am' : 'en';
  try { localStorage.setItem('ea_lang', lang); } catch(e){}
  haptic('light');
  applyLang();
}
function timeAgo(d){
  const s = Math.floor((Date.now() - new Date(d).getTime()) / 1000);
  if (lang === 'am') {
    if (s < 60) return 'አሁን';
    const m = Math.floor(s/60); if (m < 60) return m + ' ደቂቃ በፊት';
    const h = Math.floor(m/60); if (h < 24) return h + ' ሰዓት በፊት';
    return Math.floor(h/24) + ' ቀን በፊት';
  }
  if (s < 60) return 'just now';
  const m = Math.floor(s/60); if (m < 60) return m + (m === 1 ? ' minute ago' : ' minutes ago');
  const h = Math.floor(m/60); if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  const dd = Math.floor(h/24); return dd + (dd === 1 ? ' day ago' : ' days ago');
}

/* ---------- app ---------- */
const tg = window.Telegram?.WebApp;
let me = null, doneTasks = new Set(), startedTasks = new Set(), selMethod = 'telebirr';
let hideBal = false, showAllActs = false;

/* crash-proof element lookup — a missing element can never kill the app again */
function $(id){
  const el = document.getElementById(id);
  if (el) return el;
  const d = document.createElement('div');
  d.style.display = 'none';
  document.body.appendChild(d);
  return d;
}

function fmt(n){ return Number(n || 0).toLocaleString('en-US'); }
function todayUTC(){ return new Date().toISOString().slice(0, 10); }
function notify(m){ if (tg && tg.showAlert) tg.showAlert(m); else alert(m); }
function haptic(x){ try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(x); } catch(e){} }
function tick(){ try { tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch(e){} }
function showScreen(id){ ['locked','errscreen','nottg'].forEach(s => $(s).classList.toggle('hide', s !== id)); }

function getDeviceId(){
  try {
    let d = localStorage.getItem('ea_did');
    if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : 'd' + Date.now() + Math.random().toString(36).slice(2, 12)); localStorage.setItem('ea_did', d); }
    return d;
  } catch(e){ return null; }
}

if (!tg || !tg.initData) { showScreen('nottg'); } else { start(); }

async function start() {
  tg.ready();
  tg.expand();
  try {
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, startParam: tg.initDataUnsafe?.start_param || '', deviceId: getDeviceId() })
    });
    const a = await r.json();
    if (a.error === 'MULTI_ACCOUNT') { document.getElementById('app').classList.add('hide'); showScreen('locked'); return; }
    if (!a.user) throw new Error(a.error || 'Login failed');
    await loadMe();
  } catch (e) {
    document.getElementById('app').classList.add('hide');
    $('errMsg').textContent = e.message + ' — please close and reopen the app.';
    showScreen('errscreen');
  }
}

async function loadMe() {
  const r = await fetch('/api/me', { headers: { 'x-init-data': tg.initData } });
  me = await r.json();
  doneTasks = new Set(me.tasks_done || []);
  renderAll();
}

function avatarHtml(pic, name, cls) {
  if (pic) return '<span class="' + cls + '"><img src="' + pic + '" alt=""></span>';
  return '<span class="' + cls + '">' + ((name || '?')[0] || '?').toUpperCase() + '</span>';

/* ================= WATCH & EARN (Monetag) ================= */
const AD_ZONE = '10937696';
const AD_FUNC = 'show_' + AD_ZONE;
const AD_SDK_URL = 'https://libtl.com/sdk.js';
const AD_REWARD = 5;
const AD_DAILY_LIMIT = 25;

let adBusy = false, adLoading = null;
function sdkLoaded(){ return typeof window[AD_FUNC] === 'function'; }

function tryLoadSdkOnce(timeoutMs) {
  return new Promise(resolve => {
    if (sdkLoaded()) return resolve(true);
    let done = false;
    const s = document.createElement('script');
    s.src = AD_SDK_URL + '?t=' + Date.now();
    s.setAttribute('data-zone', AD_ZONE);
    s.setAttribute('data-sdk', AD_FUNC);
    s.async = true;
    const finish = ok => { if (!done) { done = true; resolve(ok); } };
    s.onload = () => {
      let tries = 0;
      const chk = setInterval(() => {
        tries++;
        if (sdkLoaded()) { clearInterval(chk); finish(true); }
        else if (tries > 24) { clearInterval(chk); finish(false); }
      }, 250);
    };
    s.onerror = () => { s.remove(); finish(false); };
    document.head.appendChild(s);
    setTimeout(() => finish(sdkLoaded()), timeoutMs);
  });
}

async function loadAdSdk() {
  if (sdkLoaded()) return true;
  if (adLoading) return adLoading;
  adLoading = (async () => {
    for (let i = 0; i < 3; i++) {
      const ok = await tryLoadSdkOnce(20000);
      if (ok) { adLoading = null; return true; }
      await new Promise(r2 => setTimeout(r2, 1000));
    }
    adLoading = null;
    return false;
  })();
  return adLoading;
}

setTimeout(() => loadAdSdk(), 1200);

function renderAd() {
  const el = $('adCard');
  if (!el || !me) return;
  const a = me.ads || { watched: 0, limit: AD_DAILY_LIMIT };
  const left = a.limit - a.watched;
  let segs = '';
  for (let i = 0; i < a.limit; i++) segs += '<span' + (i < a.watched ? ' class="on"' : '') + '></span>';
  const btn = left > 0
    ? '<button class="btn" id="adBtn" onclick="watchAd()"><i class="ic dark sm" data-ic="play"></i> ' + t('watch_ad') + ' — +' + AD_REWARD + ' ETB</button>'
    : '<button class="btn btn-ghost" disabled>' + t('limit_reached') + '</button>';
  el.innerHTML = '<div class="card"><p class="ctitle"><i class="ic" data-ic="play"></i> ' + t('watch_earn') + '</p>' +
    '<div class="segbar">' + segs + '</div>' +
    '<p class="note" style="margin:0 0 12px">' + a.watched + '/' + a.limit + ' ' + t('ads_today') + ' • ' + left + ' ' + t('left') + ' • ' + t('watch_hint') + '</p>' + btn + '</div>';
  el.querySelectorAll('[data-ic]').forEach(x => { x.innerHTML = icon(x.dataset.ic); });
}

async function watchAd() {
  if (adBusy) return;
  adBusy = true;
  const btn = $('adBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading ad…'; }

  const ok = await loadAdSdk();
  if (!ok) {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="ic dark sm" data-ic="play"></i> ' + t('watch_ad') + ' — +' + AD_REWARD + ' ETB'; }
    document.querySelectorAll('#adCard [data-ic]').forEach(x => { x.innerHTML = icon(x.dataset.ic); });
    adBusy = false;
    haptic('error');
    return notify('Ad not available right now — try again in a minute');
  }

  try {
    await window[AD_FUNC]();
    const r = await fetch('/api/ad', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData })
    });
    const d = await r.json();
    if (r.ok) {
      me.points = d.balance;
      me.ads = { watched: d.watched, limit: d.limit };
      haptic('success');
      notify('+' + d.reward + ' ETB! ' + (d.limit - d.watched) + ' ' + t('left'));
      await loadMe();
    } else {
      notify(d.error || 'Failed to credit reward');
      if (btn) { btn.disabled = false; btn.textContent = t('watch_ad') + ' — +' + AD_REWARD + ' ETB'; }
    }
  } catch (e) {
    haptic('error');
    notify('Ad not available or closed early — no reward this time');
    if (btn) { btn.disabled = false; btn.textContent = t('watch_ad') + ' — +' + AD_REWARD + ' ETB'; }
  } finally { adBusy = false; }
}

/* ================= LUCKY WHEEL (SVG) ================= */
const SEG = [0, 1.5, 0, 3, 0, 2, 0, 1.5];
const SEG_COLOR = { 0: '#151515', 1.5: '#3D3D3D', 2: '#FFFFFF', 3: '#4ADE80' };
let wheelR = 0, spinning = false, gameHistory = [];

function buildWheel() {
  const cx = 130, cy = 130, r = 118;
  let svg = '';
  for (let i = 0; i < 8; i++) {
    const a0 = (i * 45 - 90) * Math.PI / 180;
    const a1 = ((i + 1) * 45 - 90) * Math.PI / 180;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    svg += '<path d="M ' + cx + ' ' + cy + ' L ' + x0.toFixed(2) + ' ' + y0.toFixed(2) +
      ' A ' + r + ' ' + r + ' 0 0 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2) + ' Z" fill="' + SEG_COLOR[SEG[i]] + '"/>';
  }
  for (let i = 0; i < 8; i++) {
    const m = SEG[i];
    const txt = m === 0 ? '×' : 'x' + m;
    const fill = m === 0 ? '#6A6A6A' : (m === 2 || m === 3 ? '#000000' : '#FFFFFF');
    const size = m === 0 ? 18 : 15;
    svg += '<text x="130" y="54" text-anchor="middle" font-size="' + size + '" font-weight="800" fill="' + fill +
      '" transform="rotate(' + (i * 45 + 22.5) + ' 130 130)" font-family="Inter,-apple-system,sans-serif">' + txt + '</text>';
  }
  for (let i = 0; i < 8; i++) {
    const a = (i * 45 - 90) * Math.PI / 180;
    svg += '<circle cx="' + (cx + 107 * Math.cos(a)).toFixed(2) + '" cy="' + (cy + 107 * Math.sin(a)).toFixed(2) +
      '" r="3" fill="#FFFFFF" opacity=".75"/>';
  }
  svg += '<circle cx="130" cy="130" r="124" fill="none" stroke="#242424" stroke-width="5"/>';
  $('wheel').innerHTML = svg;
}
buildWheel();

async function playGame() {
  if (spinning) return;
  const bet = parseInt($('gbet').value, 10);
  if (!bet || bet < 50) return notify(t('m_min_bet'));
  if (bet > 5000) return notify(t('m_max_bet'));
  if (bet > me.points) return notify(t('m_no_bal'));

  spinning = true;
  $('spinBtn').disabled = true;
  $('hub').textContent = '·';

  try {
    const r = await fetch('/api/game', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, bet })
    });
    const d = await r.json();
    if (!r.ok) {
      spinning = false; $('spinBtn').disabled = false; $('hub').textContent = 'SPIN';
      return notify(d.error || 'Failed');
    }

    me.points = d.balance;
    renderBalance();
    $('wBalance').textContent = fmt(me.points);

    const idxs = SEG.map((m, i) => m === d.mult ? i : -1).filter(i => i >= 0);
    const idx = idxs[Math.floor(Math.random() * idxs.length)];
    const a = idx * 45 + 22.5 + (Math.random() * 16 - 8);
    const corr = (((-a - wheelR) % 360) + 360) % 360;
    wheelR += 4 * 360 + corr;
    $('wheel').style.transform = 'rotate(' + wheelR + 'deg)';

    [80, 200, 360, 560, 800, 1080, 1400, 1780, 2220, 2720, 3280, 3900].forEach(x => setTimeout(tick, x));

    setTimeout(() => {
      $('hub').textContent = d.mult > 0 ? 'x' + d.mult : '×';
      if (d.mult > 0) {
        haptic('success');
        notify('+' + fmt(d.win) + ' ETB (x' + d.mult + ')');
      } else {
        haptic('error');
      }
      gameHistory.unshift({ m: d.mult, win: d.win });
      gameHistory = gameHistory.slice(0, 8);
      $('gres').innerHTML = gameHistory.map(g =>
        '<span class="gtag' + (g.win > 0 ? ' win' : '') + '">' + (g.m > 0 ? 'x' + g.m + ' +' + fmt(g.win) : '×') + '</span>'
      ).join('');
      spinning = false;
      $('spinBtn').disabled = false;
      setTimeout(() => { $('hub').textContent = 'SPIN'; }, 1800);
    }, 4350);
  } catch (e) {
    spinning = false; $('spinBtn').disabled = false; $('hub').textContent = 'SPIN';
    notify('Error: ' + e.message);
  }
}
